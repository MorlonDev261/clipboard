# =============================================================================
# Mi Kandra Edge — routeur d'entrée partagé (80/443) pour plusieurs stacks.
#
# Rôle : aiguiller le trafic vers le nginx "origin" de chaque projet, SANS
# terminer TLS et SANS jamais toucher aux certificats. Chaque projet reste
# donc 100 % autonome (son nginx + son certbot) et fonctionne seul si ce
# routeur n'existe pas.
#
#   TLS  :443 → lecture du SNI (ssl_preread) → <alias>:8443  (PROXY protocol)
#   HTTP :80  → en-tête Host                 → <alias>:8080
#
# Robustesse :
#   • Les backends sont résolus À LA REQUÊTE (variable + resolver Docker) : un
#     projet arrêté ou absent ne peut jamais empêcher le routeur de démarrer
#     ni perturber les autres projets (c'est la cause du crash-loop
#     "host not found in upstream").
#   • Les routes vivent dans /etc/mi-kandra-edge/routes.d/*.{tls,http}.map, écrites
#     et validées (nginx -t, retour arrière) par scripts/edge/mi-kandra-edge.sh.
#   • SNI/Host inconnu → connexion refusée / 444 : jamais de fuite vers un
#     projet par défaut.
# =============================================================================
worker_processes auto;
# 2 descripteurs par connexion relayée (client + origin) : large marge.
worker_rlimit_nofile 16384;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    log_format mi_kandra_tls '$remote_addr [$time_local] sni=$ssl_preread_server_name '
                          'backend=$mi_kandra_tls_backend status=$status sent=$bytes_sent recv=$bytes_received';
    access_log /dev/stdout mi_kandra_tls;

    # Anti-saturation : plafond de connexions simultanées PAR IP source. Valeur
    # volontairement large : derrière Cloudflare, des milliers de visiteurs
    # partagent quelques IP. Abaissez-la si le serveur est exposé en direct.
    limit_conn_zone $binary_remote_addr zone=mi_kandra_conn:10m;

    map $ssl_preread_server_name $mi_kandra_tls_backend {
        hostnames;
        # SNI inconnu ou absent : port 9 (discard) — la connexion est refusée.
        default 127.0.0.1:9;
        include /etc/mi-kandra-edge/routes.d/*.tls.map;
    }

    server {
        listen 443;
        ssl_preread on;
        # Le ClientHello doit arriver vite (anti-slowloris sur la lecture du SNI).
        preread_timeout 10s;
        limit_conn mi_kandra_conn 4000;
        proxy_pass $mi_kandra_tls_backend;
        # L'origin lit l'IP réelle du client dans l'en-tête PROXY.
        proxy_protocol on;
        proxy_connect_timeout 5s;
        # WebSocket / Socket.IO : connexions longues.
        proxy_timeout 1h;
    }
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    server_tokens off;
    access_log off;

    # Le port 80 ne sert que redirections et challenges ACME : requêtes minuscules.
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          30s;
    keepalive_timeout     15s;
    client_max_body_size  1m;
    limit_conn_zone $binary_remote_addr zone=mi_kandra_http_conn:10m;
    limit_req_zone  $binary_remote_addr zone=mi_kandra_http_req:10m rate=200r/s;

    map $host $mi_kandra_http_backend {
        hostnames;
        default "";
        include /etc/mi-kandra-edge/routes.d/*.http.map;
    }

    server {
        listen 80 default_server;

        location = /__mi_kandra_edge_health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            if ($mi_kandra_http_backend = "") { return 444; }
            limit_conn mi_kandra_http_conn 1000;
            limit_req  zone=mi_kandra_http_req burst=400 nodelay;
            limit_req_status 429;
            proxy_pass http://$mi_kandra_http_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
        }
    }
}
