# Mi Kandra — IP client réelle derrière le routeur partagé (scripts/edge).
# Le routeur envoie un en-tête PROXY uniquement sur le listener interne :8443
# (jamais publié sur l hôte). Sur 80/443 directs il n y a pas d en-tête PROXY :
# ces directives restent sans effet, le mode autonome est inchangé.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header proxy_protocol;
