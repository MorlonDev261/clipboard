# =============================================================================
# TLS hardening — inclus dans chaque vhost HTTPS
# Basé sur les recommandations Mozilla Intermediate (compatible TLS 1.2+)
# Référence : https://ssl-config.mozilla.org/
# =============================================================================

# Session TLS
ssl_session_timeout 1d;
ssl_session_cache   shared:MozSSL:10m;   # ~40 000 sessions
ssl_session_tickets off;

# Protocoles et ciphers (TLS 1.2 + 1.3 uniquement)
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;

# Le certificat actuellement émis ne publie pas d'URL OCSP. Activer le
# stapling dans ce cas produit un warning Nginx à chaque rechargement.
resolver            1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout    5s;
