# Mi Kandra — IP réelle du visiteur derrière le proxy Cloudflare (« nuage orange »).
# Fichier IDENTIQUE dans chaque projet (poma, mga, artest…). Inclus au niveau http, juste après
# mi-kandra-realip.conf (qui, derrière le routeur partagé, restitue l'adresse de la connexion via
# PROXY protocol). Résultat : la variable $mk_client_ip.
#
#   • connexion qui vient d'une IP Cloudflare  → $mk_client_ip = en-tête CF-Connecting-IP
#   • toute autre connexion (accès direct)     → $mk_client_ip = $remote_addr
#
# L'en-tête CF-Connecting-IP n'est donc JAMAIS cru s'il n'arrive pas depuis une IP Cloudflare :
# quelqu'un qui contacte directement le serveur ne peut pas se faire passer pour une autre adresse.
# Sans proxy Cloudflare (DNS seul), rien ne change : $mk_client_ip = $remote_addr.
#
# Les templates posent ensuite  X-Real-IP et X-Forwarded-For = $mk_client_ip  (valeur unique,
# jamais ajoutée à une chaîne fournie par le client).
#
# Plages : https://www.cloudflare.com/ips-v4  et  /ips-v6. Elles changent très rarement ; en cas
# d'oubli le défaut est SÛR (on retombe sur l'IP de Cloudflare, jamais sur une IP falsifiée).
# Mise à jour : sh scripts/edge/mi-kandra-cfips.sh update
geo $remote_addr $mk_from_cloudflare {
    default 0;
    # >>> cloudflare-ips (généré — ne pas éditer à la main)
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
    # <<< cloudflare-ips
}

# Depuis Cloudflare ET avec un CF-Connecting-IP renseigné → on le prend ; sinon l'adresse de la connexion.
map "$mk_from_cloudflare:$http_cf_connecting_ip" $mk_client_ip {
    default           $remote_addr;
    "~^1:(?<cfip>.+)$" $cfip;
}
