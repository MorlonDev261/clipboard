name: clipboard
description: "Clipboard — a personal content library for social media managers and creators."
publish_to: "none"
version: 0.1.2+4003

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.3

  # Navigation
  go_router: ^18.0.1

  # Filesystem / paths (the workspace folder on disk is the source of truth)
  path_provider: ^2.1.5
  path: ^1.9.0

  # Identifiers & hashing
  uuid: ^4.5.1
  crypto: ^3.0.6

  # File selection, drag & drop, sharing, media
  # v11 (win32 <6) is required for compatibility with super_clipboard; only the
  # web fallback in AppFilePicker uses it now (the in-app browser replaced it
  # everywhere else).
  file_picker: ^11.0.3
  desktop_drop: ^0.8.4
  # Native share sheet (caption + attached images) from the note screen.
  # Pinned to 12.x: share_plus 13+ requires win32 ^6, which conflicts with
  # super_clipboard/super_native_extensions (win32 <6).
  share_plus: ^12.0.0
  url_launcher: ^6.3.1
  # Clipboard image support (Flutter's native clipboard is text-only)
  pasteboard: ^0.4.0

  # NOTE: flutter_secure_storage (future secrets) and permission_handler
  # (runtime permissions) are intentionally NOT added yet — they pull in
  # native code that is unused by the current MVP and breaks the Windows
  # build on recent MSVC toolchains. They will be re-added, at compatible
  # versions, in the milestone that actually needs them.

  # Utilities
  intl: any
  meta: ^1.15.0
  collection: ^1.19.0
  super_clipboard: ^0.9.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  flutter_svg: ^2.0.17
  webview_flutter: ^4.14.1
  app_links: ^7.2.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/deganeo/logo-Deganeo.svg

# App launcher icons (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  # Full-blue launcher icon: solid brand blue fills the whole icon, white
  # figure on top. Android uses an adaptive icon (blue background + figure-only
  # foreground); other platforms use the pre-composited blue icon.
  image_path: "assets/icon/icon_blue.png"
  android: true
  adaptive_icon_background: "#204DA0"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#204DA0"
  web:
    generate: true
    background_color: "#204DA0"
    theme_color: "#204DA0"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
