name: clipboard
description: "Clipboard — a personal content library for social media managers and creators."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Local database (Drift / SQLite)
  drift: ^2.23.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.26

  # Filesystem / paths
  path_provider: ^2.1.5
  path: ^1.9.0

  # Identifiers & hashing
  uuid: ^4.5.1
  crypto: ^3.0.6

  # File selection, sharing, media
  file_picker: ^8.1.6
  share_plus: ^10.1.3
  video_player: ^2.9.2

  # NOTE: flutter_secure_storage (future secrets) and permission_handler
  # (runtime permissions) are intentionally NOT added yet — they pull in
  # native code that is unused by the current MVP and breaks the Windows
  # build on recent MSVC toolchains. They will be re-added, at compatible
  # versions, in the milestone that actually needs them.

  # Utilities
  intl: any
  meta: ^1.15.0
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation for Drift
  drift_dev: ^2.23.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
