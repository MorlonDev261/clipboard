name: clipboard
description: "Clipboard — a personal content library for social media managers and creators."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.3

  # Navigation
  go_router: ^18.0.1

  # Filesystem / paths (the workspace folder on disk is the source of truth)
  path_provider: ^2.1.5
  path: ^1.9.0

  # Identifiers & hashing
  uuid: ^4.5.1
  crypto: ^3.0.6

  # File selection, drag & drop, sharing, media
  # v11 (win32 <6) is required for compatibility with super_clipboard; only the
  # web fallback in AppFilePicker uses it now (the in-app browser replaced it
  # everywhere else).
  file_picker: ^11.0.3
  desktop_drop: ^0.8.4
  # Pinned to 12.x: share_plus 13+ requires win32 ^6, which conflicts with
  # super_clipboard/super_native_extensions (win32 <6). share_plus is not used
  # yet, so this only affects the transitive win32 version.
  share_plus: ^12.0.0
  video_player: ^2.9.2

  # Clipboard image support (Flutter's native clipboard is text-only)
  pasteboard: ^0.4.0

  # NOTE: flutter_secure_storage (future secrets) and permission_handler
  # (runtime permissions) are intentionally NOT added yet — they pull in
  # native code that is unused by the current MVP and breaks the Windows
  # build on recent MSVC toolchains. They will be re-added, at compatible
  # versions, in the milestone that actually needs them.

  # Utilities
  intl: any
  meta: ^1.15.0
  collection: ^1.19.0
  super_clipboard: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

# App launcher icons (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  web:
    generate: true
    background_color: "#ffffff"
    theme_color: "#1E50A0"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
